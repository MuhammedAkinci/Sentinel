[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "@somnia/=src/interfaces/somnia/"
]
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
verbosity = 4
fuzz = { runs = 1000 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
somnia_testnet = "${SOMNIA_RPC_HTTP}"

[etherscan]
# Shannon Explorer is Blockscout-based; etherscan-compatible verification endpoint
somnia_testnet = { key = "${EXPLORER_API_KEY}", url = "https://shannon-explorer.somnia.network/api", chain = 50312 }
